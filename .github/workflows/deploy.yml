name: Deploy Agenda Ai
on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest        # runner do GitHub, tem Maven e JDK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn clean package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  deploy:
    needs: build
    runs-on: self-hosted          # tua VM, só recebe o JAR
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
      - run: |
          sudo cp *.jar /var/app/app.jar
          sudo systemctl restart agenda-ai